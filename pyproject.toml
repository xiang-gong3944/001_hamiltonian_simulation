[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hamiltonian-resources"
version = "0.1.0"
description = "Circuit-level resource comparison for Hamiltonian simulation algorithms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "qiskit>=1.4,<3",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "pylatexenc>=2.10,<3",
  "jupyterlab>=4.1,<5",
  "notebook>=7.1,<8",
  "ipykernel>=6.29,<7",
  "nbconvert>=7.16,<8",
  "nbformat>=5.10,<6",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
qsp = ["pyqsp>=0.1.6,<0.3"]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]

[project.scripts]
hamiltonian-benchmark = "hamiltonian_resources.benchmark_cli:main"
hamiltonian-resource-grid = "hamiltonian_resources.resource_grid_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hamiltonian_resources = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
