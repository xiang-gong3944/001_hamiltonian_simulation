[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hamiltonian-resources"
version = "0.1.0"
description = "Circuit-level resource comparison for Hamiltonian simulation algorithms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "qiskit>=1.4,<3",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "pylatexenc>=2.10,<3",
  "jupyterlab>=4.1,<5",
  "ipykernel>=6.29,<7",
]

[project.optional-dependencies]
qsp = ["pyqsp>=0.1.6,<0.3"]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
